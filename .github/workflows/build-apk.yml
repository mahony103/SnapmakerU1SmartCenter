name: Build Snapmaker U1 Smart Center APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: ZIP dosyasını otomatik bul ve aç
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Repoda ZIP dosyası bulunamadı."
            echo "Önce Android proje ZIP dosyasını repoya yüklemelisin."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Android projesini bul
        run: |
          set -e

          PROJECT_DIR=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: Android projesi bulunamadı."
            echo "settings.gradle veya settings.gradle.kts dosyası bulunamadı."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android projesi: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android projesini kontrol et
        run: |
          echo "Proje klasörü:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Gradle dosyaları:"
          find "$PROJECT_DIR" -maxdepth 2 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \
            -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: APK oluştur
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: SnapmakerU1SmartCenter-debug
          path: |
            project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
